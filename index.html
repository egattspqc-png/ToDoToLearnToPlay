<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>To Do · To Learn · To Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<header class="topbar">
  <h1 id="pageTitle">หน้าแรก</h1>
</header>

<main id="app">

  <!-- ============ VIEW 1: CALENDAR (default) ============ -->
  <section class="view" id="view-calendar">
    <div class="cal-header">
      <button class="cal-nav" id="prevMonth" aria-label="เดือนก่อนหน้า">‹</button>
      <div class="cal-month" id="calMonthLabel">กรกฎาคม 2026</div>
      <button class="cal-nav" id="nextMonth" aria-label="เดือนถัดไป">›</button>
    </div>
    <div class="cal-weekdays">
      <span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>

    <div class="cal-legend">
      <span class="legend-dot dot-todo"></span> To Do
      <span class="legend-dot dot-learn"></span> To Learn
      <span class="legend-dot dot-play"></span> To Play
    </div>

    <div id="dayPanel" class="day-panel hidden">
      <div class="day-panel-head">
        <strong id="dayPanelDate">—</strong>
        <button id="closeDayPanel" class="icon-btn" aria-label="ปิด">×</button>
      </div>
      <div id="dayPanelList" class="day-panel-list list-rows"></div>
    </div>
  </section>

  <!-- ============ VIEW 2/3/4: LIST VIEWS ============ -->
  <section class="view hidden list-view" id="view-todo" data-category="todo"></section>
  <section class="view hidden list-view" id="view-learn" data-category="learn"></section>
  <section class="view hidden list-view" id="view-play" data-category="play"></section>

</main>

<button id="fabAdd" class="fab hidden" aria-label="เพิ่มรายการใหม่">+</button>

<!-- ============ BOTTOM NAV ============ -->
<nav class="bottomnav">
  <button class="navbtn active" data-view="calendar">
    <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>หน้าแรก</span>
  </button>
  <button class="navbtn" data-view="todo">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>To Do</span>
  </button>
  <button class="navbtn" data-view="learn">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 19V6a2 2 0 012-2h9l5 5v10a2 2 0 01-2 2H6a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.8"/><path d="M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>To Learn</span>
  </button>
  <button class="navbtn" data-view="play">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M10 9l5 3-5 3V9z" fill="currentColor"/></svg>
    <span>To Play</span>
  </button>
</nav>

<!-- ============ MODAL: VIEW (Preview) ============ -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">

    <!-- ---------- PREVIEW PANEL (read-only) ---------- -->
    <div id="viewPanel">
      <div class="modal-head">
        <h2 id="viewTitle">ชื่อรายการ</h2>
        <button id="viewClose" class="icon-btn" aria-label="ปิด">×</button>
      </div>

      <div class="view-badges">
        <span id="viewCategoryBadge" class="badge">To Do</span>
        <span id="viewDoneBadge" class="badge badge-muted">ยังไม่เสร็จ</span>
      </div>

      <div id="viewNotesRow" class="view-row hidden">
        <span class="view-label">รายละเอียด</span>
        <p id="viewNotes" class="view-text"></p>
      </div>

      <div class="view-row">
        <span class="view-label">วันเริ่ม</span>
        <span id="viewStart" class="view-text">—</span>
      </div>

      <div class="view-row">
        <span class="view-label">วันกำหนดจบ</span>
        <span id="viewDue" class="view-text">—</span>
      </div>

      <div id="viewLinkRow" class="view-row hidden">
        <span class="view-label">ลิงก์อ้างอิง</span>
        <button type="button" id="viewLinkBtn" class="btn btn-link">🔗 เปิดลิงก์</button>
      </div>

      <div id="viewPhotoRow" class="view-row hidden">
        <span class="view-label">รูปภาพ</span>
        <img id="viewPhoto" class="photo-preview photo-preview-lg" alt="แตะเพื่อดูรูปเต็ม">
      </div>

      <div class="modal-actions">
        <button type="button" id="viewDeleteBtn" class="btn btn-danger">ลบ</button>
        <div class="modal-actions-right">
          <button type="button" id="viewCloseBtn2" class="btn btn-ghost">ปิด</button>
          <button type="button" id="viewEditBtn" class="btn btn-primary">แก้ไข</button>
        </div>
      </div>
    </div>

    <!-- ---------- EDIT PANEL (form) ---------- -->
    <div id="editPanel" class="hidden">
      <div class="modal-head">
        <h2 id="modalTitle">รายการใหม่</h2>
        <button id="modalClose" class="icon-btn" aria-label="ปิด">×</button>
      </div>

      <form id="itemForm">
        <input type="hidden" id="f_id">
        <input type="hidden" id="f_category">

        <label class="field">
          <span>ชื่อรายการ</span>
          <input type="text" id="f_title" required placeholder="เช่น ส่งรายงาน">
        </label>

        <label class="field">
          <span>รายละเอียด</span>
          <textarea id="f_notes" rows="2" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
        </label>

        <div class="field-row">
          <label class="field">
            <span>วันเริ่ม</span>
            <input type="date" id="f_start">
          </label>
          <label class="field">
            <span>วันกำหนดจบ</span>
            <input type="date" id="f_due">
          </label>
        </div>

        <label class="field">
          <span>ลิงก์อ้างอิง</span>
          <div class="link-row">
            <input type="url" id="f_link" placeholder="https://...">
            <button type="button" id="qrScanBtn" class="btn btn-ghost btn-icon-only" aria-label="สแกน QR Code">📷 QR</button>
          </div>
        </label>

        <label class="field">
          <span>รูปภาพ</span>
          <div class="photo-row">
            <img id="f_photo_preview" class="photo-preview hidden" alt="รูปที่บันทึกไว้ แตะเพื่อดูรูปเต็ม">
            <button type="button" id="photoPickBtn" class="btn btn-ghost">เพิ่ม/ถ่ายรูปใหม่</button>
          </div>
          <input type="file" id="f_photo" accept="image/*" capture="environment" class="hidden-file-input">
        </label>

        <label class="field-checkbox">
          <input type="checkbox" id="f_done">
          <span>ทำเสร็จแล้ว</span>
        </label>

        <div class="modal-actions">
          <button type="button" id="deleteBtn" class="btn btn-danger hidden">ลบ</button>
          <div class="modal-actions-right">
            <button type="button" id="cancelBtn" class="btn btn-ghost">ยกเลิก</button>
            <button type="submit" class="btn btn-primary">บันทึก</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ============ LIGHTBOX (full-screen photo) ============ -->
<div id="lightbox" class="lightbox hidden">
  <img id="lightboxImg" src="" alt="รูปขยาย">
</div>

<!-- ============ QR SCANNER OVERLAY ============ -->
<div id="qrOverlay" class="qr-overlay hidden">
  <div class="qr-header">
    <span>สแกน QR Code</span>
    <button id="qrCloseBtn" class="icon-btn" aria-label="ปิด">×</button>
  </div>
  <video id="qrVideo" class="qr-video" playsinline autoplay muted></video>
  <canvas id="qrCanvas" class="hidden-file-input"></canvas>
  <p id="qrHint" class="qr-hint">เล็งกล้องไปที่ QR Code</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
